[project]
name = "project-omilia"
version = "0.1.0"
description = "Project Omilia"
readme = "README.md"
authors = [
    { name = "RegMain", email = "kharkov.ivan.an@gmail.com" },
    { name = "aleksandrvd131", email = ""}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi >= 0.115.0",
    "gtts >= 2.5.0",
    "mediapipe>=1.2.0",
    "numpy>=1.26.4",
    "opencv-python>=4.10.0",
    "ruff>=0.17.3",
    "scikit-learn>=1.9.1",
    "urllib3>=2.8.0",
    "unicorn[standart] >= 0.30.0",
    "websockets >= 12.0",

]

[project.scripts]
project-omilia = "project_omilia:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
