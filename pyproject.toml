[project]
name = "project-omilia"
version = "0.1.0"
description = "Project Omilia"
readme = "README.md"
authors = [
    { name = "RegMain", email = "kharkov.ivan.an@gmail.com" },
    { name = "aleksandrvd131", email = "aleksandr.vedyshev@gmail.com"}

]
requires-python = ">=3.12"
dependencies = [
    "fastapi >= 0.115.0",
    "gtts >= 2.5.0",
    "joblib >= 1.4.0",
    "numpy>=1.26.4",
    "pydantic >= 2.0.0",
    "ruff>=0.17.3",
    "scikit-learn>=1.5.0",
    "tslearn>=0.10.0",
    "urllib3>=2.0.0",
    "uvicorn[standard] >= 0.30.0",
    "websockets >= 12.0",
]

[project.scripts]
project-omilia = "project_omilia:main"

[project.optional-dependencies]
dev = [
    "httpx >= 0.27.0",
    "pytest >= 8.0.0",
    "pytest-asyncio >= 0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
